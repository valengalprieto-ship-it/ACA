<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="steelG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="30%" stop-color="#F8FAFC"/>
      <stop offset="70%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="brassG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="anchorOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="blueAccentT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4C81"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <filter id="shadowT" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="350" rx="12" fill="url(#bgGradT)"/>

  <!-- Blueprint/Technical Measuring Lines Background -->
  <g stroke="#0F4C81" stroke-width="1.5" opacity="0.4" stroke-dasharray="6 4">
    <circle cx="250" cy="175" r="140" fill="none"/>
    <circle cx="250" cy="175" r="90" fill="none"/>
    <line x1="50" y1="175" x2="450" y2="175"/>
    <line x1="250" y1="25" x2="250" y2="325"/>
  </g>

  <!-- 1. Huge Central Hex Bolt -->
  <g filter="url(#shadowT)" transform="translate(200, 30)">
    <!-- Hexagon Bolt Head -->
    <polygon points="50,0 90,0 110,35 90,70 50,70 30,35" fill="url(#steelG)"/>
    <polygon points="55,8 85,8 100,35 85,62 55,62 40,35" fill="#CBD5E1"/>
    <!-- Threaded Shaft -->
    <rect x="52" y="70" width="36" height="200" fill="url(#steelG)"/>
    <polygon points="52,270 70,285 88,270" fill="url(#steelG)"/>
    <!-- Thread Ridges -->
    <g stroke="#334155" stroke-width="3">
      <line x1="52" y1="90" x2="88" y2="96"/>
      <line x1="52" y1="110" x2="88" y2="116"/>
      <line x1="52" y1="130" x2="88" y2="136"/>
      <line x1="52" y1="150" x2="88" y2="156"/>
      <line x1="52" y1="170" x2="88" y2="176"/>
      <line x1="52" y1="190" x2="88" y2="196"/>
      <line x1="52" y1="210" x2="88" y2="216"/>
      <line x1="52" y1="230" x2="88" y2="236"/>
      <line x1="52" y1="250" x2="88" y2="256"/>
    </g>
  </g>

  <!-- 2. Wood Screw (Left Diagonal) -->
  <g filter="url(#shadowT)" transform="translate(60, 60) rotate(-25)">
    <!-- Flat Countersunk Head -->
    <polygon points="10,0 50,0 40,25 20,25" fill="url(#steelG)"/>
    <!-- Philips Cross Drive -->
    <line x1="22" y1="6" x2="38" y2="6" stroke="#1E293B" stroke-width="4"/>
    <line x1="30" y1="0" x2="30" y2="12" stroke="#1E293B" stroke-width="4"/>
    <!-- Shaft -->
    <rect x="23" y="25" width="14" height="180" fill="url(#steelG)"/>
    <polygon points="23,205 30,225 37,205" fill="url(#steelG)"/>
    <!-- Sharp Threads -->
    <g stroke="#1E293B" stroke-width="2.5">
      <line x1="18" y1="50" x2="37" y2="58"/>
      <line x1="18" y1="70" x2="37" y2="78"/>
      <line x1="18" y1="90" x2="37" y2="98"/>
      <line x1="18" y1="110" x2="37" y2="118"/>
      <line x1="18" y1="130" x2="37" y2="138"/>
      <line x1="18" y1="150" x2="37" y2="158"/>
      <line x1="18" y1="170" x2="37" y2="178"/>
      <line x1="18" y1="190" x2="37" y2="198"/>
    </g>
  </g>

  <!-- 3. Brass Machine Screw (Right) -->
  <g filter="url(#shadowT)" transform="translate(360, 50) rotate(20)">
    <!-- Round Pan Head -->
    <path d="M 10,25 C 10,0 50,0 50,25 Z" fill="url(#brassG)"/>
    <line x1="18" y1="10" x2="42" y2="10" stroke="#451A03" stroke-width="4"/>
    <rect x="24" y="25" width="12" height="170" fill="url(#brassG)"/>
  </g>

  <!-- 4. Metallic Hex Nuts (Bottom Left & Right) -->
  <!-- Nut 1 (Left) -->
  <g filter="url(#shadowT)" transform="translate(100, 220)">
    <polygon points="30,0 60,0 75,26 60,52 30,52 15,26" fill="url(#steelG)"/>
    <circle cx="45" cy="26" r="16" fill="#0F172A"/>
    <circle cx="45" cy="26" r="16" fill="none" stroke="url(#steelG)" stroke-width="3"/>
  </g>

  <!-- Nut 2 (Front Right) -->
  <g filter="url(#shadowT)" transform="translate(320, 200)">
    <polygon points="40,0 80,0 100,35 80,70 40,70 20,35" fill="url(#steelG)"/>
    <circle cx="60" cy="35" r="22" fill="#0F172A"/>
    <circle cx="60" cy="35" r="22" fill="none" stroke="url(#steelG)" stroke-width="4"/>
  </g>

  <!-- 5. Washers & Plastic Wall Plugs / Chazos (Foreground Bottom) -->
  <!-- Washer 1 -->
  <g filter="url(#shadowT)" transform="translate(190, 250)">
    <ellipse cx="30" cy="20" rx="30" ry="15" fill="url(#steelG)"/>
    <ellipse cx="30" cy="20" rx="12" ry="6" fill="#0F172A"/>
  </g>

  <!-- Orange Plastic Wall Anchor / Chazo -->
  <g filter="url(#shadowT)" transform="translate(240, 220) rotate(-45)">
    <rect x="0" y="0" width="16" height="90" rx="3" fill="url(#anchorOrange)"/>
    <!-- Collar lip -->
    <rect x="-4" y="0" width="24" height="8" rx="2" fill="url(#anchorOrange)"/>
    <!-- Expansion fins -->
    <polygon points="-5,30 0,35 0,45 -5,50" fill="#EA580C"/>
    <polygon points="21,30 16,35 16,45 21,50" fill="#EA580C"/>
  </g>
</svg>
