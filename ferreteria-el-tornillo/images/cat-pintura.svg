<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="bluePaint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="orangePaint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="yellowPaint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="metalP" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="woodP" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="shadowP" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="350" rx="12" fill="url(#bgGradP)"/>

  <!-- Background Paint Splashes -->
  <path d="M 400,40 Q 440,20 460,60 Q 480,100 450,130 Q 410,150 390,100 Z" fill="url(#bluePaint)" opacity="0.2"/>
  <path d="M 50,220 Q 30,260 60,300 Q 100,320 120,280 Q 110,230 70,220 Z" fill="url(#orangePaint)" opacity="0.2"/>

  <!-- 1. Paint Tray (Bottom Left) -->
  <g filter="url(#shadowP)" transform="translate(40, 160)">
    <polygon points="10,40 180,60 220,130 30,110" fill="#334155"/>
    <!-- Wet paint in tray -->
    <polygon points="25,55 170,72 205,120 40,105" fill="url(#bluePaint)"/>
  </g>

  <!-- 2. Big Paint Can (Center-Right) -->
  <g filter="url(#shadowP)" transform="translate(260, 80)">
    <!-- Metal Bucket Body -->
    <path d="M 0,20 L 140,20 L 125,180 L 15,180 Z" fill="url(#metalP)"/>
    <!-- Bucket Rim -->
    <ellipse cx="70" cy="20" rx="70" ry="14" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
    <!-- Label -->
    <path d="M 5,50 L 135,50 L 128,140 L 12,140 Z" fill="url(#orangePaint)"/>
    <text x="70" y="90" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#FFF" text-anchor="middle">PINTURA</text>
    <text x="70" y="115" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0F172A" text-anchor="middle">SUPER LAVABLE</text>

    <!-- Liquid Paint inside bucket top -->
    <ellipse cx="70" cy="20" rx="63" ry="11" fill="url(#orangePaint)"/>

    <!-- Drips running down outer bucket -->
    <path d="M 30,20 Q 35,60 40,75 Q 45,90 35,92 Q 25,90 28,60 Z" fill="url(#orangePaint)"/>
    <path d="M 85,20 Q 90,45 92,55 Q 95,65 88,67 Q 82,65 83,45 Z" fill="url(#orangePaint)"/>
  </g>

  <!-- 3. Smaller Paint Can (Left) -->
  <g filter="url(#shadowP)" transform="translate(130, 70)">
    <rect x="0" y="15" width="90" height="110" rx="6" fill="url(#metalP)"/>
    <ellipse cx="45" cy="15" rx="45" ry="8" fill="#CBD5E1"/>
    <ellipse cx="45" cy="15" rx="40" ry="6" fill="url(#bluePaint)"/>
    <rect x="0" y="40" width="90" height="50" fill="url(#bluePaint)"/>
    <text x="45" y="70" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#FFF" text-anchor="middle">ESMALTE</text>
  </g>

  <!-- 4. Paint Roller (Overlapping Tray & Cans) -->
  <g filter="url(#shadowP)" transform="translate(100, 30) rotate(-20)">
    <!-- Roller Sleeve -->
    <rect x="50" y="0" width="130" height="42" rx="10" fill="url(#bluePaint)"/>
    <!-- Wet paint texture on roller -->
    <rect x="65" y="0" width="20" height="42" fill="#1E40AF"/>
    <rect x="115" y="0" width="25" height="42" fill="#1E40AF"/>
    
    <!-- Metal Arm Frame -->
    <path d="M 180,21 L 210,21 L 210,110 L 160,130" fill="none" stroke="url(#metalP)" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Handle -->
    <rect x="140" y="125" width="30" height="90" rx="6" fill="url(#woodP)"/>
    <rect x="140" y="190" width="30" height="25" rx="4" fill="url(#orangePaint)"/>
  </g>

  <!-- 5. Paint Brush (Front Right) -->
  <g filter="url(#shadowP)" transform="translate(320, 180) rotate(40)">
    <!-- Handle -->
    <path d="M 15,100 L 35,100 L 40,220 C 40,230 10,230 10,220 Z" fill="url(#woodP)"/>
    <!-- Hole in handle -->
    <circle cx="25" cy="210" r="5" fill="#0F172A"/>
    <!-- Metal Ferrule -->
    <rect x="10" y="50" width="30" height="50" fill="url(#metalP)"/>
    <!-- Bristles -->
    <path d="M 10,50 L 40,50 L 42,0 C 42,-5 8,-5 8,0 Z" fill="url(#yellowPaint)"/>
    <!-- Wet paint tip -->
    <path d="M 8,0 L 42,0 L 42,18 Q 25,28 8,18 Z" fill="url(#orangePaint)"/>
  </g>

  <!-- Dripping Paint Drops -->
  <circle cx="220" cy="270" r="7" fill="url(#bluePaint)"/>
  <circle cx="240" cy="295" r="4" fill="url(#bluePaint)"/>
  <circle cx="430" cy="310" r="6" fill="url(#orangePaint)"/>
</svg>
