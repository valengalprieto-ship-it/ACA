<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="bulbGlow" x1="50%" y1="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="40%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#EAB308" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cableRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#FCA5A5"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="cableBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="orangeE" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="metalE" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="50%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <filter id="shadowE" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glowEffect">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="350" rx="12" fill="url(#bgGradE)"/>

  <!-- Energy Light Rays -->
  <g stroke="#FDE047" stroke-width="1.5" opacity="0.3" stroke-dasharray="4 4">
    <line x1="380" y1="90" x2="330" y2="40"/>
    <line x1="380" y1="90" x2="440" y2="40"/>
    <line x1="380" y1="90" x2="450" y2="90"/>
    <line x1="380" y1="90" x2="440" y2="150"/>
    <line x1="380" y1="90" x2="320" y2="130"/>
    <line x1="380" y1="90" x2="380" y2="20"/>
  </g>

  <!-- 1. Heavy Wire Spool / Coil (Left Side) -->
  <g filter="url(#shadowE)" transform="translate(40, 80)">
    <!-- Outer Coil Circles -->
    <ellipse cx="90" cy="110" rx="80" ry="60" fill="none" stroke="url(#cableRed)" stroke-width="26"/>
    <ellipse cx="90" cy="100" rx="80" ry="60" fill="none" stroke="url(#cableBlue)" stroke-width="26"/>
    <ellipse cx="90" cy="90" rx="80" ry="60" fill="none" stroke="url(#orangeE)" stroke-width="26"/>
    
    <!-- Cable Ties/Straps -->
    <rect x="80" y="25" width="20" height="135" rx="4" fill="#0F172A" opacity="0.8"/>
    <rect x="20" y="80" width="140" height="20" rx="4" fill="#0F172A" opacity="0.8"/>

    <!-- Uncoiled Wire Extending Out -->
    <path d="M 160,90 Q 220,90 240,180 T 320,240" fill="none" stroke="url(#cableRed)" stroke-width="10" stroke-linecap="round"/>
    <!-- Copper Core exposed at tip -->
    <line x1="315" y1="240" x2="330" y2="245" stroke="url(#metalE)" stroke-width="4"/>
  </g>

  <!-- 2. Glowing LED Bulb (Upper Right) -->
  <!-- Outer Glow Circle -->
  <circle cx="380" cy="90" r="70" fill="url(#bulbGlow)"/>
  
  <g filter="url(#shadowE)" transform="translate(340, 30)">
    <!-- Glass Bulb Shape -->
    <path d="M 15,60 C -10,20 20,-10 40,-10 C 60,-10 90,20 65,60 C 55,75 52,90 52,100 L 28,100 C 28,90 25,75 15,60 Z" fill="#FEF08A" opacity="0.9" filter="url(#glowEffect)"/>
    <!-- LED Filament Inside -->
    <path d="M 33,60 Q 40,30 47,60" fill="none" stroke="#FF6B00" stroke-width="3"/>
    <line x1="33" y1="60" x2="33" y2="90" stroke="url(#metalE)" stroke-width="2"/>
    <line x1="47" y1="60" x2="47" y2="90" stroke="url(#metalE)" stroke-width="2"/>
    <!-- Screw Base (E27) -->
    <rect x="28" y="100" width="24" height="22" fill="url(#metalE)"/>
    <line x1="28" y1="106" x2="52" y2="106" stroke="#475569" stroke-width="2"/>
    <line x1="28" y1="112" x2="52" y2="112" stroke="#475569" stroke-width="2"/>
    <line x1="28" y1="118" x2="52" y2="118" stroke="#475569" stroke-width="2"/>
    <!-- Contact Point -->
    <polygon points="34,122 46,122 40,128" fill="#1E293B"/>
  </g>

  <!-- 3. Heavy Duty Electrical Male Plug (Center Bottom) -->
  <g filter="url(#shadowE)" transform="translate(200, 200) rotate(-15)">
    <!-- Plug Body -->
    <rect x="30" y="30" width="60" height="70" rx="10" fill="#0F4C81"/>
    <rect x="25" y="20" width="70" height="15" rx="4" fill="url(#orangeE)"/>
    <!-- Rubber Strain Relief Boot -->
    <path d="M 45,100 L 75,100 L 70,135 L 50,135 Z" fill="#0F172A"/>
    <!-- Prongs -->
    <rect x="40" y="-5" width="10" height="25" rx="2" fill="url(#metalE)"/>
    <rect x="70" y="-5" width="10" height="25" rx="2" fill="url(#metalE)"/>
    <!-- Hole in prongs -->
    <circle cx="45" cy="2" r="2.5" fill="#334155"/>
    <circle cx="75" cy="2" r="2.5" fill="#334155"/>
  </g>

  <!-- 4. Wall Switch Plate (Right Center) -->
  <g filter="url(#shadowE)" transform="translate(370, 190)">
    <!-- Faceplate -->
    <rect x="0" y="0" width="80" height="110" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="3"/>
    <!-- Screws on plate -->
    <circle cx="40" cy="12" r="3" fill="url(#metalE)"/>
    <line x1="38" y1="12" x2="42" y2="12" stroke="#334155" stroke-width="1"/>
    <circle cx="40" cy="98" r="3" fill="url(#metalE)"/>
    <line x1="38" y1="98" x2="42" y2="98" stroke="#334155" stroke-width="1"/>
    <!-- Switch Rocker -->
    <rect x="24" y="30" width="32" height="50" rx="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
    <polygon points="24,30 56,30 56,55 24,55" fill="url(#orangeE)"/>
    <!-- ON Indicator dot -->
    <circle cx="40" cy="42" r="3" fill="#FFF"/>
  </g>

  <!-- 5. Insulated Wire Stripper Pliers (Foreground Left) -->
  <g filter="url(#shadowE)" transform="translate(110, 180) rotate(50)">
    <!-- Metal Jaws -->
    <path d="M 20,10 L 35,10 L 32,70 L 23,70 Z" fill="url(#metalE)"/>
    <path d="M 37,10 L 52,10 L 49,70 L 40,70 Z" fill="url(#metalE)"/>
    <!-- Cutting Notch -->
    <circle cx="36" cy="45" r="4" fill="#0F172A"/>
    <!-- Pivot Bolt -->
    <circle cx="36" cy="65" r="6" fill="#334155"/>
    <!-- Insulated Handles -->
    <path d="M 23,70 Q 10,120 5,160 L 25,160 Q 30,120 36,70 Z" fill="url(#orangeE)"/>
    <path d="M 49,70 Q 62,120 67,160 L 47,160 Q 42,120 36,70 Z" fill="url(#orangeE)"/>
  </g>
</svg>
